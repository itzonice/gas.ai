name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The project lives in studypulse/; every step runs there.
defaults:
  run:
    working-directory: studypulse

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studypulse/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: studypulse/.nvmrc
          cache: pnpm
          cache-dependency-path: studypulse/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  secret-scan:
    name: Client bundle secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studypulse/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: studypulse/.nvmrc
          cache: pnpm
          cache-dependency-path: studypulse/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Builds web and mobile with canary values in every server secret, then fails if a
      # canary or a real-looking secret shows up in anything a client downloads.
      - run: pnpm secrets:scan

  migrations:
    name: Migrations and SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studypulse/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: studypulse/.nvmrc
          cache: pnpm
          cache-dependency-path: studypulse/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Only the database is needed to apply migrations and run SQL tests.
      - name: Start Postgres
        run: pnpm exec supabase db start
      - name: Apply every migration from scratch and seed
        run: pnpm exec supabase db reset
      - name: Lint schema
        run: pnpm exec supabase db lint --level warning --fail-on error
      - name: Run SQL tests
        run: pnpm exec supabase test db
      - name: Run concurrency tests (two real sessions)
        run: for t in supabase/tests/concurrency/*.sh; do bash "$t"; done
      - name: Check generated database types are up to date
        run: |
          pnpm db:types
          if ! git diff --exit-code -- packages/db/src/database.types.ts; then
            echo "::error::packages/db types are stale. Run 'pnpm db:types' and commit the result."
            exit 1
          fi
